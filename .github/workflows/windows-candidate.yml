name: Windows x86 helper and x64 VST3 candidate
on:
  push:
    branches:
      - research/original-engine-abi
  workflow_dispatch:

jobs:
  x86:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32 C++23 probe and helper
        run: cmake -S . -B build32 -G "Visual Studio 17 2022" -A Win32 -DBUILD_TESTING=ON
      - name: Compile x86 helper and deterministic mock
        run: cmake --build build32 --config Release --parallel 2
      - name: Run actual x86 mock fixture (NOT original synth)
        run: ctest --test-dir build32 -C Release --output-on-failure
      - name: Test packaged BAT with fake x86 engine (positive and missing-bank rejection)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'fruity-bat-contract'
          $source = Join-Path $fixture 'src/Fruity Soundfont Player'
          New-Item -ItemType Directory -Force -Path (Join-Path $source 'Data') | Out-Null
          Copy-Item 'build32/Release/fruity_mock_engine.dll' (Join-Path $source 'FLSPro.dll')
          Copy-Item 'tests/mock-bank.txt' (Join-Path $source 'Data/Default.sf2')
          Copy-Item 'build32/Release/125A-Fruity-Probe32.exe' (Join-Path $fixture '125A-Fruity-Probe32.exe')
          Copy-Item 'scripts/Test-Fruity-Original-Engine.bat' (Join-Path $fixture 'Test-Fruity-Original-Engine.bat')
          $archive = Join-Path $fixture 'Fruity Soundfont Player.zip'
          Compress-Archive -Path $source -DestinationPath $archive -Force
          & (Join-Path $fixture 'Test-Fruity-Original-Engine.bat')
          if ($LASTEXITCODE -ne 0) { throw 'Mock positive: BAT failed to locate bank or engine' }
          $log = Get-Content (Join-Path $fixture 'TEST_ERGEBNIS.txt') -Raw
          if ($log -notmatch 'CHECK ZIP=OK DLL=OK BANK=OK' -or $log -notmatch 'PASS ORIGINAL ENGINE PCM PROBE') {
            throw 'Positive BAT lacks actual verified PCM probe completion'
          }
          $wav = Join-Path $fixture 'TestOriginal.wav'
          if (-not (Test-Path $wav) -or (Get-Item $wav).Length -le 44) { throw 'Positive BAT did not produce WAV' }
          Remove-Item (Join-Path $source 'Data/Default.sf2')
          Compress-Archive -Path $source -DestinationPath $archive -Force
          & (Join-Path $fixture 'Test-Fruity-Original-Engine.bat')
          if ($LASTEXITCODE -ne 4) { throw 'Missing-bank BAT must exit 4, not run a stale or guessed asset' }
          $log = Get-Content (Join-Path $fixture 'TEST_ERGEBNIS.txt') -Raw
          if ($log -notmatch 'ERROR ASSETS' -or $log -match 'PASS ORIGINAL ENGINE') { throw 'Missing bank accepted as success' }
          if (Test-Path $wav) { throw 'Stale output WAV survived missing-bank test' }
          Write-Host 'P99 contract: ZIP extraction and correct DLL/SF2 path positive/negative PASS (mock only)' 
          exit 0
      - name: Stage helper without third-party DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path helper-stage | Out-Null
          Copy-Item "build32/Release/125A-Fruity-Helper32.exe" "helper-stage/125A-Fruity-Helper32.exe"
          Copy-Item "build32/Release/125A-Fruity-Probe32.exe" "helper-stage/125A-Fruity-Probe32.exe"
          $p = [IO.File]::ReadAllBytes((Resolve-Path "helper-stage/125A-Fruity-Helper32.exe"))
          $pe = [BitConverter]::ToInt32($p, 0x3c)
          if ([BitConverter]::ToUInt16($p, $pe + 4) -ne 0x014c) { throw "Helper is not x86" }
      - uses: actions/upload-artifact@v4
        with:
          name: proprietary-free-x86-helper
          path: helper-stage/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: test-only-x86-fake-engine
          path: build32/Release/fruity_mock_engine.dll
          if-no-files-found: error
          retention-days: 2

  x64:
    needs: x86
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Obtain pinned official Steinberg VST3 SDK
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/steinbergmedia/vst3sdk.git sdk
          git -C sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C sdk submodule update --init --recursive
          $rev = git -C sdk rev-parse HEAD
          if ($rev -ne "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96") { throw "Wrong VST3 SDK" }
      - name: Configure native Windows x64 VST3
        shell: pwsh
        run: |
          $sdk = (Resolve-Path "sdk").Path
          cmake -S . -B build64 -G "Visual Studio 17 2022" -A x64 "-DVST3_SDK_ROOT=$sdk" -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
      - name: Compile x64 VST3
        shell: pwsh
        run: |
          cmake --build build64 --config Release --target FruitySoundFont FruityBridgeSmoke --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "MSVC VST3 build failed" }
      - uses: actions/download-artifact@v4
        with:
          name: proprietary-free-x86-helper
          path: helper-stage
      - uses: actions/download-artifact@v4
        with:
          name: test-only-x86-fake-engine
          path: smoke-engine
      - name: Prove original-ABI worker delivers MIDI-triggered PCM through x64 IPC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'smoke-stage/Contents'
          New-Item -ItemType Directory -Force -Path "$root/x86_64-win","$root/Resources" | Out-Null
          Copy-Item 'build64/Release/FruityBridgeSmoke.exe' "$root/x86_64-win/FruityBridgeSmoke.exe"
          Copy-Item 'helper-stage/125A-Fruity-Helper32.exe' "$root/Resources/125A-Fruity-Helper32.exe"
          Copy-Item 'smoke-engine/fruity_mock_engine.dll' "$root/Resources/FLSPro.dll"
          Copy-Item 'tests/mock-bank.txt' "$root/Resources/SynthBank.sf2"
          & "$root/x86_64-win/FruityBridgeSmoke.exe"
          if ($LASTEXITCODE -ne 0) { throw 'FAIL x64/x86 worker independent audio and MIDI smoke' }
      - name: Build correctly named installable candidate directory
        shell: pwsh
        run: |
          $mods = @(Get-ChildItem "build64" -Filter "*.vst3" -Recurse -File | Where-Object { $_.Length -gt 20000 })
          if ($mods.Count -ne 1) { throw "Expected exactly one compiled VST3 module; found $($mods.Count)" }
          $name = "125A Fruity SoundFont Player.vst3"
          $folder = Join-Path "stage" $name
          $target = Join-Path $folder "Contents/x86_64-win"
          $resources = Join-Path $folder "Contents/Resources"
          New-Item -ItemType Directory -Force -Path $target, $resources | Out-Null
          Copy-Item $mods[0].FullName (Join-Path $target $name)
          Copy-Item "helper-stage/125A-Fruity-Helper32.exe" (Join-Path $resources "125A-Fruity-Helper32.exe")
          $binary = Join-Path $target $name
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $binary))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw "VST3 is not x64 PE" }
          if ((Get-ChildItem $resources -File).Count -ne 1) { throw "Non-owned resources in bundle" }
          Get-FileHash $binary -Algorithm SHA256
          Write-Host "Staged native x64 VST3 + independently compiled x86 helper; original DLL absent."
      - uses: actions/upload-artifact@v4
        with:
          name: original-engine-vst3-development-candidate
          path: stage/
          if-no-files-found: error
          retention-days: 7

  independent-test-lab:
    needs: x64
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: original-engine-vst3-development-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: test-only-x86-fake-engine
          path: test-only-engine
      - name: Build the actual universal 125A Plugin Test Lab, pinned to reviewed main
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/challanger2000/125A-Plugin-Test-Lab.git test-lab
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone central Test Lab' }
          git -C test-lab checkout bc839e345bfc5657f9196f7db8d6945584e1bec7
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout pinned Lab commit' }
          $sha = git -C test-lab rev-parse HEAD
          if ($sha -ne 'bc839e345bfc5657f9196f7db8d6945584e1bec7') { throw 'Wrong Test Lab source' }
          cmake -S test-lab -B lab-build -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Test Lab configure failed' }
          cmake --build lab-build --config Release --target TestLabHost TestLabStateStress TestLabGUI --parallel 3
          if ($LASTEXITCODE -ne 0) { throw 'Test Lab native hosts failed to build' }
      - name: Execute actual Lab VST3 discovery and technical quickcheck
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plugin = (Resolve-Path 'candidate/125A Fruity SoundFont Player.vst3').Path
          $gui = @(Get-ChildItem lab-build -Recurse -File -Filter '125A_Test_Lab_GUI.exe')
          $audio = @(Get-ChildItem lab-build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          $stress = @(Get-ChildItem lab-build -Recurse -File -Filter '125A_Test_Lab_State_Stress.exe')
          if ($gui.Count -ne 1 -or $audio.Count -ne 1 -or $stress.Count -ne 1) {
            throw 'Actual central Test Lab native hosts missing or ambiguous'
          }
          New-Item -ItemType Directory -Force lab-results | Out-Null
          python test-lab/tests/run_vst3_auto_discovery.py --plugin "$plugin" --gui-host "$($gui[0].FullName)" --audio-host "$($audio[0].FullName)" --stress-host "$($stress[0].FullName)" --out 'lab-results/discovery'
          if ($LASTEXITCODE -ne 0) { throw 'Central Test Lab failed real native VST3 discovery' }
          $discovery = Get-Content 'lab-results/discovery/DISCOVERY-RESULT.json' -Raw | ConvertFrom-Json
          if ($discovery.status -ne 'DISCOVERY_COMPLETE' -or $discovery.release_approved -ne $false) { throw 'Invalid Lab discovery evidence' }
          python test-lab/tests/run_plugin_quickcheck.py --plugin "$plugin" --host "$($audio[0].FullName)" --stress-host "$($stress[0].FullName)" --gui-host "$($gui[0].FullName)" --out 'lab-results/technical' --timeout 120
          $rc = $LASTEXITCODE
          $quick = Get-Content 'lab-results/technical/QUICKCHECK-RESULT.json' -Raw | ConvertFrom-Json
          if ($quick.release_approved -ne $false) { throw 'Central Lab incorrectly approved unreleased instrument' }
          if ($rc -ne 0 -or $quick.status -ne 'TECHNICAL_PASS') {
            throw 'Central Test Lab rejected candidate (see independently recorded evidence)'
          }
          Write-Host 'Test Lab technical host gates PASS; original-engine PCM and DAW are NOT VERIFIED'
      - name: Independent real VST3 MIDI to x86 worker to PCM oracle (temporary fake engine only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plugin = (Resolve-Path 'candidate/125A Fruity SoundFont Player.vst3').Path
          $resources = Join-Path $plugin 'Contents/Resources'
          $mock = (Resolve-Path 'test-only-engine/fruity_mock_engine.dll').Path
          Copy-Item -LiteralPath $mock -Destination (Join-Path $resources 'FLSPro.dll')
          Copy-Item -LiteralPath 'tests/mock-bank.txt' -Destination (Join-Path $resources 'SynthBank.sf2')
          $labHost = @(Get-ChildItem lab-build -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          if ($labHost.Count -ne 1) { throw 'Independent native Test Lab audio host missing' }
          $wave = 'lab-results/bridge-midi-output.wav'
          & $labHost[0].FullName --render "$plugin" "$wave"
          if ($LASTEXITCODE -ne 0) { throw 'Actual Lab VST3 MIDI render failed' }
          if (!(Test-Path $wave)) { throw 'Missing native Lab output WAV' }
          python -c "import wave,sys; w=wave.open(sys.argv[1]); assert(w.getnchannels()==2 and w.getframerate()==44100 and w.getnframes()>300000); data=w.readframes(w.getnframes()); nz=sum(b!=0 for b in data); print('INDEPENDENT_REAL_VST3_MIDI_BRIDGE_PCM_NONZERO_BYTES',nz); sys.exit(0 if nz>1000 else 1)" "$wave"
          if ($LASTEXITCODE -ne 0) { throw 'FAIL: x64 VST3 -> x86 worker did NOT produce audible PCM' }
          Remove-Item -LiteralPath (Join-Path $resources 'FLSPro.dll') -Force
          Remove-Item -LiteralPath (Join-Path $resources 'SynthBank.sf2') -Force
          $silent = 'lab-results/bridge-negative-no-engine.wav'
          & $labHost[0].FullName --render "$plugin" "$silent"
          if ($LASTEXITCODE -ne 0) { throw 'Missing-engine VST3 host failed to degrade safely' }
          python -c "import wave,sys; w=wave.open(sys.argv[1]); data=w.readframes(w.getnframes()); print('INDEPENDENT_MISSING_ENGINE_NONZERO_BYTES',sum(b!=0 for b in data)); sys.exit(0 if not any(data) else 1)" "$silent"
          if ($LASTEXITCODE -ne 0) { throw 'Missing-engine negative PCM control unexpectedly produced sound' }
          Write-Host 'PASS exact VST3->Win32 helper->PCM with test-only fake engine; genuine FLSPro not executed'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-125a-test-lab-fruity-evidence
          path: lab-results/
          if-no-files-found: warn
          retention-days: 7
